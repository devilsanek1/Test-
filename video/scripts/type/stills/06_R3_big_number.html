<!doctype html><html><head><meta charset="utf-8"><script src="../lib/type.js"></script>
<style>html,body{margin:0;padding:0}#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:url('{{BG_NIGHT}}') center/cover no-repeat}
.lab{position:absolute;font-family:'Jost';font-weight:400;font-size:30px;letter-spacing:0.04em;color:rgba(255,240,222,0.78)}</style></head>
<body><div id="stage"></div>
<script>
// "70,000" pops 2.300 s (frame 138), "homes?" builds 3.383 s (frame 203), both on to 4.233 s
window.__ready = TYPE.run(() => {
  const S = TYPE.stage(), tone = 'night';
  // the brush's own comma is wide with a long tail ("70 , 000" at a glance): the figures set as "70", a smaller comma
  // tucked against them, then "000", the whole number centred near x 440 as before
  const a = TYPE.text(S, {t: '70', x: 150, y: 480, anchor: 'start', role: 'brush', size: 300, tone, accent: true});
  const c = TYPE.text(S, {t: ',', x: a.x1 + 8, y: 480, anchor: 'start', role: 'brush', size: 190, tone, accent: true});
  TYPE.text(S, {t: '000', x: c.x1 + 14, y: 480, anchor: 'start', role: 'brush', size: 300, tone, accent: true});
  TYPE.text(S, {t: 'homes?', x: 930, y: 578, anchor: 'end', role: 'hand', size: 116, tone});
});
</script></body></html>
