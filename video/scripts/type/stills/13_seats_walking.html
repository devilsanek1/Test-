<!doctype html><html><head><meta charset="utf-8"><script src="../lib/type.js"></script>
<style>html,body{margin:0;padding:0}#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0c1024}
.lab{position:absolute;font-family:'Jost';font-weight:400;font-size:30px;letter-spacing:0.04em;color:rgba(255,240,222,0.78)}</style></head>
<body><div id="stage"></div>
<style>.fr{position:absolute;width:1080px;height:1920px;transform-origin:0 0;transform:scale(0.5);background:url('{{BG_NIGHT}}') center/cover no-repeat;overflow:hidden}</style>
<div class="fr" id="f0" style="left:0;top:0"></div><div class="fr" id="f1" style="left:540px;top:0"></div>
<div class="fr" id="f2" style="left:0;top:960px"></div><div class="fr" id="f3" style="left:540px;top:960px"></div>
<script>
window.__ready = TYPE.run(() => {
  const tone = 'night';
  const groups = [
    ['f0', 'C', ['AI actually runs'], '4.50 s'], ['f1', 'L', ['on giant', 'computers,'], '6.00 s'],
    ['f2', 'R', ['in buildings', 'called'], '7.00 s'], ['f3', 'C', ['data centers.'], '8.00 s']];
  for (const [id, seat, lines, t] of groups) {
    const S = TYPE.stage(id);
    TYPE.group(S, {seat, lines, tone, baselines: lines.length === 1 ? [455] : [395, 515]});
    const lab = document.createElement('div'); lab.className = 'lab';
    lab.style.cssText = 'left:40px;top:1830px;font-size:52px'; lab.textContent = `${t} · seat ${seat} (x ${TYPE.C.seats[seat]})`;
    document.getElementById(id).appendChild(lab);
  }
});
</script></body></html>
