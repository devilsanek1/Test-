<script>
// R9 the payoff as THE LIT HAND (PLEASANT.md): "So your chatbot" pops 38.433 s, "could soon" 39.367 s, "heat" 39.900 s

// "an apartment / in Helsinki." follows at 40.217 s. "heat": the hand's Bold 156 px, honey, the golden glow, 40 px after "soon".
window.__ready = TYPE.run(() => {
  const S = TYPE.stage(), tone = 'night', k = 1 - Math.pow(1 - 6 / 8, 3);
  TYPE.text(S, {t: 'So your chatbot', x: 110, y: 390, role: 'hand', size: 116, tone});
  const c = TYPE.text(S, {t: 'could soon', x: 120, y: 545, role: 'hand', size: 116, tone});
  TYPE.text(S, {t: 'heat', x: c.x1 + 40, y: 545, role: 'hand', size: 156, tone, stress: true, bloom: k, scale: 0.96 + 0.04 * k});
});
</script></body></html>
