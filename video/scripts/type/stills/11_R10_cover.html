// the core line as the cover title: hand 300 120 px, "heat" brush 260 px amber; 4 rows, ragged and stepped, left edge ~110

  TYPE.text(S, {t: 'an apartment', x: 130, y: 624, role: 'hand', size: 112, tone});
  TYPE.text(S, {t: 'in Helsinki.', x: 290, y: 733, role: 'hand', size: 112, tone});
});
