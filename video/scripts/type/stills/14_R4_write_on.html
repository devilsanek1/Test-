<!doctype html><html><head><meta charset="utf-8"><script src="../lib/type.js"></script>
<style>html,body{margin:0;padding:0}#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:url('{{BG_DUSK}}') center/cover no-repeat}</style></head>
<body><div id="stage"></div>
<script>
// R4's entrance after PLEASANT.md: the brush write-on is retired (part-letters behind a dragged dry edge read as a word
// being daubed on, and a reveal that cuts letters is ruled out). The stressed word pops WHOLE in place and its light
// BLOOMS: halo 0 -> full and scale 0.96 -> 1.00 in 8 frames (ease-out cubic). S7 at 24.00 s (frame 1440): "But
// Helsinki" on since 23.417 s; "wants" popped at 23.967 s (frame 1438), 2 of 8 frames in (ease-out: 58 %); "that heat." later.
window.__ready = TYPE.run(() => {
  const S = TYPE.stage(), tone = 'light', k = 1 - Math.pow(1 - 2 / 8, 3);
  TYPE.text(S, {t: 'But Helsinki', x: 130, y: 362, role: 'hand', size: 116, tone});
  TYPE.text(S, {t: 'wants', x: 236, y: 482, role: 'hand', size: 160, tone, stress: true, bloom: k, scale: 0.96 + 0.04 * k});
  window.__bloom = {progress: k};
});
</script></body></html>
