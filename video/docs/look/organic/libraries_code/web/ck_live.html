<!doctype html><meta charset="utf-8"><body style="margin:0">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="/npm/node_modules/canvaskit-wasm/bin/full/canvaskit.js"></script>
<script>
// CanvasKit on WebGL (SwiftShader) in headless Chrome = the @remotion/skia path: the SkSL live warp, ms per frame.
(async () => {
  try {
    const CK = await CanvasKitInit({ locateFile: (f) => '/npm/node_modules/canvaskit-wasm/bin/full/' + f });
    const bytes = await (await fetch('/inputs/still_v6.png')).arrayBuffer();
    const img = CK.MakeImageFromEncoded(new Uint8Array(bytes));
    const surf = CK.MakeWebGLCanvasSurface('c');
    if (!surf) throw new Error('no WebGL surface');
    const fx = CK.RuntimeEffect.Make(`
uniform shader img; uniform float time;
float h(float2 p) { return fract(sin(dot(p, float2(127.1, 311.7))) * 43758.5453); }
float vn(float2 p) { float2 i = floor(p), f = fract(p); f = f * f * (3 - 2 * f);
  return mix(mix(h(i), h(i + float2(1, 0)), f.x), mix(h(i + float2(0, 1)), h(i + float2(1, 1)), f.x), f.y); }
float fbm(float2 p) { float s = 0, a = 0.5; for (int k = 0; k < 4; k++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
half4 main(float2 p) {
  float inBox = step(560, p.x) * step(p.y, 345);
  float2 q = p / 70 + float2(time * 0.15, 0);
  float2 w = float2(fbm(q), fbm(q + 31.7)) - 0.5;
  return img.eval(p + inBox * w * 12);
}`);
    const c = surf.getCanvas(); const p = new CK.Paint();
    const frame = (t) => { p.setShader(fx.makeShaderWithChildren([t], [img.makeShaderOptions(CK.TileMode.Clamp, CK.TileMode.Clamp, CK.FilterMode.Linear, CK.MipmapMode.None)]));
      c.drawRect(CK.LTRBRect(0, 0, 1080, 1920), p); surf.flush();
      const gl = document.getElementById('c').getContext('webgl2') || document.getElementById('c').getContext('webgl');
      if (gl) { const px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); } };
    frame(0);
    const N = 20, t0 = performance.now();
    for (let i = 0; i < N; i++) frame(i / 60);
    const ms = (performance.now() - t0) / N;
    window.__done = { png: document.getElementById('c').toDataURL('image/png'), info: { ms_per_frame: Math.round(ms) } };
  } catch (e) { window.__done = { error: String(e && e.stack || e) }; }
})();
</script>
